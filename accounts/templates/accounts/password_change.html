{% extends 'base.html' %}
{% load form_tags %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-heading mb-4">
    <span class="eyebrow text-primary">Security</span>
    <h1 class="h3 mb-0">Change Password</h1>
    <p class="text-muted mb-0">Update your account password.</p>
</div>

<div class="card auth-card">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
                {% render_field field %}
            {% endfor %}
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-key me-1"></i>Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
