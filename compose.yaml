services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 20
  web:
    build: .
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.production
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - application:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: [python, manage.py, process_training_jobs]
    env_file: .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.production
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - application:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - application:/data/app:ro
      - certificates:/data/caddy
      - proxy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  database:
  application:
  certificates:
  proxy_config:
